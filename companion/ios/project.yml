# XcodeGen spec for VoidHealth. VoidHealth.xcodeproj is generated from this
# and committed, so you don't need XcodeGen to build. To regenerate after
# changing this file: `xcodegen generate` in this folder.
name: VoidHealth
options:
  bundleIdPrefix: com.andysocial
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: T963633DC5
    CODE_SIGN_STYLE: Automatic
packages:
  VoidHealthCore:
    path: VoidHealthCore
targets:
  VoidHealth:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VoidHealth
        excludes:
          - "Info.plist"
    dependencies:
      - package: VoidHealthCore
        product: VoidHealthCore
    info:
      path: VoidHealth/Info.plist
      properties:
        CFBundleDisplayName: VoidHealth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: VoidHealth connects to your PineTime watch to sync your steps, heart rate, sleep, water and workouts, including in the background.
        UIBackgroundModes:
          - bluetooth-central
        UIRequiredDeviceCapabilities:
          - bluetooth-le
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andysocial.voidhealth
        PRODUCT_NAME: VoidHealth
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
    scheme: {}
